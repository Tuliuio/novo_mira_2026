<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Campo · Narrativa de Marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0a;
    --ink:#efeee9;
    --body:#b7b7b1;
    --dim:#6d6d66;
    --faint:#4a4a44;
    --line:rgba(255,255,255,.11);
    --accent:#93a277;      /* verde-sálvia */
    --accent-dim:#75835d;
    --stageW:1280px;
    --stageH:720px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #stage{
    width:var(--stageW);height:var(--stageH);position:relative;
    background:var(--bg);overflow:hidden;transform-origin:center center;
    box-shadow:0 40px 120px rgba(0,0,0,.6);
  }
  .slide{position:absolute;inset:0;padding:58px 70px 54px;opacity:0;visibility:hidden;
    transition:opacity .5s ease;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}

  /* running header / footer */
  .rhead{position:absolute;top:44px;left:70px;font-size:11px;letter-spacing:.22em;
    color:var(--dim);text-transform:uppercase;font-weight:500}
  .rfoot{position:absolute;bottom:34px;left:70px;right:70px;display:flex;justify-content:space-between;
    font-size:10.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;font-weight:500}

  /* generic type */
  .kicker{font-size:13px;letter-spacing:.30em;text-transform:uppercase;color:var(--dim);font-weight:500}
  .display{font-weight:300;color:var(--ink);letter-spacing:-.01em;line-height:1.04}
  h1.title{font-size:74px;font-weight:300;color:var(--ink);letter-spacing:-.015em;line-height:1}
  .rule{height:1px;background:var(--line);width:100%}

  /* pills */
  .pills{display:flex;flex-wrap:wrap;gap:12px}
  .pill{border:1px solid rgba(255,255,255,.26);border-radius:40px;padding:9px 18px;
    font-size:12.5px;letter-spacing:.06em;color:var(--body);font-weight:500;white-space:nowrap}

  /* ---------- COVER ---------- */
  .cover{display:flex;flex-direction:column;justify-content:center}
  .cover .kicker{margin-bottom:26px}
  .cover h1{font-size:96px;font-weight:200;color:var(--ink);letter-spacing:-.02em;line-height:.98}
  .cover .sub{margin-top:22px;font-size:17px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:500}
  .cover .meta{position:absolute;left:70px;bottom:110px;color:var(--dim);font-size:13px;line-height:1.8;font-weight:400;letter-spacing:.02em}

  /* ---------- INDEX ---------- */
  .idx .head{margin-bottom:30px}
  .idx .kicker{margin-bottom:12px}
  .idx h2{font-size:58px;font-weight:200;color:var(--ink);letter-spacing:-.01em}
  .cols{display:grid;grid-template-columns:1fr 1fr;column-gap:70px;margin-top:26px}
  .irow{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:baseline;
    padding:15px 0;border-bottom:1px solid var(--line)}
  .irow .n{color:var(--accent-dim);font-size:14px;font-weight:500}
  .irow .t{color:var(--body);font-size:16.5px;font-weight:400}
  .irow.plus .n{color:var(--accent)}
  .irow.plus .t{color:var(--ink)}

  /* ---------- SB7 hybrid ---------- */
  .sb{display:grid;grid-template-columns:35% 1fr;gap:56px;height:100%;align-content:center;
    padding-top:20px}
  .sb-left{display:flex;flex-direction:column;justify-content:center}
  .sb-num{font-size:150px;font-weight:200;color:var(--ink);line-height:.9;letter-spacing:-.03em}
  .sb-label{margin-top:6px;font-size:19px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:500}
  .sb-ess{margin-top:26px;font-size:21px;font-weight:300;color:var(--body);line-height:1.4;max-width:330px}
  .sb-body{align-self:center;max-width:600px}
  .field{margin-bottom:24px}
  .field:last-child{margin-bottom:0}
  .field-l{font-size:11.5px;letter-spacing:.20em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-bottom:9px}
  .field-t{font-size:16.5px;line-height:1.6;color:var(--body);font-weight:400}
  .field-t b{color:var(--ink);font-weight:500}
  .want{border-left:2px solid var(--accent);padding:4px 0 4px 20px}
  .want .field-t{font-size:20px;line-height:1.45;color:var(--ink);font-weight:300}

  /* numbered plan */
  .steps{display:flex;flex-direction:column;gap:14px}
  .step{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:baseline}
  .step .sn{color:var(--accent);font-size:15px;font-weight:500}
  .step .st{font-size:16.5px;line-height:1.5;color:var(--body)}
  .step .st b{color:var(--ink);font-weight:500}

  /* transformation from->to */
  .fromto{display:grid;grid-template-columns:1fr 34px 1fr;gap:18px;align-items:center;margin-top:4px}
  .ft-box .lab{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:500}
  .ft-box .txt{font-size:15.5px;line-height:1.5;color:var(--body)}
  .ft-box.to .txt{color:var(--ink)}
  .ft-arrow{color:var(--accent);font-size:26px;text-align:center;font-weight:200}

  /* ---------- STATEMENT (one-liner) ---------- */
  .stmt{display:flex;flex-direction:column;justify-content:center}
  .stmt .kicker{margin-bottom:34px}
  .stmt p{font-size:34px;font-weight:200;color:var(--ink);line-height:1.32;letter-spacing:-.01em;max-width:1050px}
  .stmt p b{font-weight:400;color:#fff}

  /* ---------- generic section w/ big statement + 3 blocks ---------- */
  .lead{display:flex;flex-direction:column;justify-content:center;height:100%;padding-top:10px}
  .lead .kicker{margin-bottom:20px}
  .lead h2{font-size:46px;font-weight:200;color:var(--ink);letter-spacing:-.01em;line-height:1.08;max-width:900px}
  .lead h2 em{font-style:normal;color:var(--accent)}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:52px}
  .trio .tl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:12px}
  .trio .tt{font-size:16px;line-height:1.55;color:var(--body)}
  .note{margin-top:44px;font-size:15px;line-height:1.6;color:var(--dim);max-width:960px;
    border-top:1px solid var(--line);padding-top:22px}
  .note b{color:var(--body);font-weight:500}

  /* ---------- validate / next (numbered big) ---------- */
  .qlist{display:flex;flex-direction:column;gap:26px;margin-top:40px;max-width:1000px}
  .q{display:grid;grid-template-columns:56px 1fr;gap:22px;align-items:start}
  .q .qn{font-size:40px;font-weight:200;color:var(--accent);line-height:.9}
  .q .qt{font-size:18.5px;line-height:1.5;color:var(--body);font-weight:400;padding-top:6px}
  .q .qt b{color:var(--ink);font-weight:500}

  /* progress + counter */
  #bar{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:10;transition:width .4s ease}
  #count{position:fixed;bottom:16px;right:20px;color:#5a5a54;font-size:12px;letter-spacing:.15em;z-index:10;font-weight:500}
  #hint{position:fixed;bottom:16px;left:20px;color:#4a4a44;font-size:11px;letter-spacing:.08em;z-index:10;
    transition:opacity 1s ease;font-weight:400}

  /* ---------- PRINT / PDF MODE ---------- */
  html,body,#fit,#stage,.slide{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:1280px 720px;margin:0}
  body.printing{overflow:visible;background:var(--bg)}
  body.printing #fit{position:static;display:block;height:auto;background:var(--bg)}
  body.printing #stage{transform:none!important;width:1280px;height:auto;box-shadow:none}
  body.printing .slide{position:relative;inset:auto;opacity:1!important;visibility:visible!important;
    width:1280px;height:720px;page-break-after:always;break-after:page}
  body.printing .slide:last-child{page-break-after:auto;break-after:auto}
  body.printing #bar,body.printing #count,body.printing #hint{display:none!important}
</style>
</head>
<body>
<div id="bar"></div>
<div id="fit"><div id="stage"></div></div>
<div id="count"></div>
<div id="hint">← → para navegar &nbsp;·&nbsp; F para tela cheia</div>

<script>
/* ---------------- SLIDES ---------------- */
const HEAD = 'Casa Campo · Narrativa de Marca';
const FOOTL = 'Casa Campo · Narrativa de Marca';
const FOOTR = 'Mira Brand Studio';

const slides = [];

/* 1 — COVER */
slides.push(`
<div class="slide cover" data-nofoot>
  <div class="kicker">Cliente · Casa Campo</div>
  <h1>Narrativa<br>de Marca</h1>
  <div class="sub">Parque Casa Campo · Público principal</div>
  <div class="meta">
    Desenvolvido por MIRA BRAND STUDIO<br>
    Etapa 2 · Narrativa de Marca · setembro de 2026
  </div>
</div>`);

/* 2 — INDEX */
slides.push(`
<div class="slide idx">
  <div class="head">
    <div class="kicker">Narrativa · StoryBrand</div>
    <h2>O roteiro da marca</h2>
  </div>
  <div class="rule"></div>
  <div class="cols">
    <div>
      <div class="irow"><span class="n">01</span><span class="t">O herói</span></div>
      <div class="irow"><span class="n">02</span><span class="t">O problema</span></div>
      <div class="irow"><span class="n">03</span><span class="t">O guia</span></div>
      <div class="irow"><span class="n">04</span><span class="t">O plano</span></div>
    </div>
    <div>
      <div class="irow"><span class="n">05</span><span class="t">A ação</span></div>
      <div class="irow"><span class="n">06</span><span class="t">O que se evita</span></div>
      <div class="irow"><span class="n">07</span><span class="t">O sucesso</span></div>
      <div class="irow plus"><span class="n">+</span><span class="t">One-liner da marca</span></div>
    </div>
  </div>
</div>`);

/* 3 — RATIONALE (lead + trio) */
slides.push(`
<div class="slide">
  <div class="lead">
    <div class="kicker">00 · Ponto de partida</div>
    <h2>Começamos pelo público que <em>move todos os outros</em>.</h2>
    <div class="trio">
      <div><div class="tl">Volume</div><div class="tt">O parque é a frente mais acessível e de maior público, o topo do funil.</div></div>
      <div><div class="tl">Coração</div><div class="tt">É o coração emocional da marca: o afeto que atravessa todos os públicos.</div></div>
      <div><div class="tl">Cascata</div><div class="tt">Quem visita o parque vira cliente potencial de eventos e hospedagem.</div></div>
    </div>
    <div class="note">Por isso este é o roteiro da <b>marca-mãe</b>. Eventos e hospedagem virão como sub-roteiros aninhados, com o mesmo tom, o mesmo guia e a mesma promessa, sem dividir o esforço de comunicação.</div>
  </div>
</div>`);

/* helper for SB7 hybrid slide */
function sb(num,label,ess,body){
  return `
<div class="slide">
  <div class="sb">
    <div class="sb-left">
      <div class="sb-num">${num}</div>
      <div class="sb-label">${label}</div>
      <div class="sb-ess">${ess}</div>
    </div>
    <div class="sb-body">${body}</div>
  </div>
</div>`;
}

/* 4 — HERO */
slides.push(sb('01','O herói','Alguém que quer viver algo bonito ao lado de quem ama.',`
  <div class="field">
    <div class="field-l">Quem é</div>
    <div class="field-t">Renda média e alta, da região ou de passagem. Escolhe o oposto da adrenalina e do programa mais barato. A cena mais representativa é a <b>família num domingo</b>, mas também é o casal sem pressa e o grupo que passeia para contemplar.</div>
  </div>
  <div class="field want">
    <div class="field-l">O que ele quer</div>
    <div class="field-t">Viver um dia bonito ao lado de quem ama, que vire lembrança.</div>
  </div>`));

/* 5 — PROBLEMA */
slides.push(sb('02','O problema','Dias bons com quem se ama, que passam sem virar lembrança.',`
  <div class="field">
    <div class="field-l">Vilão</div>
    <div class="field-t"><b>Os dias que passam em branco</b>: tempo bom com quem se ama que não vira lembrança.</div>
  </div>
  <div class="field">
    <div class="field-l">Externo</div>
    <div class="field-t">A região oferece muitos passeios bonitos, mas um dia realmente completo e memorável, para a família toda e sem correria, quase nunca cabe num lugar só.</div>
  </div>
  <div class="field">
    <div class="field-l">Interno</div>
    <div class="field-t">O receio de que o passeio <b>não valha o que custa</b> e se perca no meio de tantos outros. O desejo de dar aos seus um dia que fique.</div>
  </div>
  <div class="field">
    <div class="field-l">Filosófico</div>
    <div class="field-t">Os dias bons com quem se ama são poucos. Merecem um lugar à altura, feito para virar memória.</div>
  </div>`));

/* 6 — GUIA */
slides.push(sb('03','O guia','Autoridade que ninguém na região tem.',`
  <div class="field">
    <div class="field-l">Empatia</div>
    <div class="field-t">“Sabemos que os dias bons com quem você ama passam rápido, e que você quer que alguns deles fiquem para sempre.”</div>
  </div>
  <div class="field">
    <div class="field-l">Autoridade · a soma</div>
    <div class="field-t">Parque, eventos e hospedagem no mesmo lugar, uma combinação que ninguém na região tem. 11 mil m² de jardins temáticos assinados por Beto Amaral. A <b>maior coleção de cactos do Brasil</b>. Mais de 20 anos e 2 mil eventos. Nota 5,0 no Google. A 15 minutos da BR-101.</div>
  </div>`));

/* 7 — PLANO */
slides.push(sb('04','O plano','Três passos simples, da chegada à saída.',`
  <div class="field">
    <div class="field-l">Plano de processo</div>
    <div class="steps">
      <div class="step"><span class="sn">1</span><span class="st"><b>Chegue com facilidade</b>: a 15 minutos da BR-101, com o ingresso garantido.</span></div>
      <div class="step"><span class="sn">2</span><span class="st"><b>Caminhe sem pressa</b>: jardins temáticos, trilhas, as histórias de cada jardim, um piquenique no gramado.</span></div>
      <div class="step"><span class="sn">3</span><span class="st"><b>Leve para casa</b>: as fotos e uma lembrança da loja.</span></div>
    </div>
  </div>
  <div class="field">
    <div class="field-l">Plano de acordo · promessas</div>
    <div class="field-t">Jardim impecável todos os dias · um dia inteiro num só lugar · natureza para contemplar, não para correr.</div>
  </div>`));

/* 8 — AÇÃO */
slides.push(sb('05','A ação','Um convite direto, e um caminho para quem ainda não decidiu.',`
  <div class="field">
    <div class="field-l">Chamada direta</div>
    <div class="field-t"><b>Garanta sua visita · Compre seu ingresso.</b></div>
  </div>
  <div class="field">
    <div class="field-l">Chamada transicional</div>
    <div class="field-t">Siga o Instagram · Receba o aviso da abertura · Baixe o mapa do parque.</div>
  </div>`));

/* 9 — FRACASSO */
slides.push(sb('06','O que se evita','O que ele deixa para trás ao dizer sim.',`
  <div class="field">
    <div class="field-l">O que está em jogo</div>
    <div class="field-t">Mais um dia que passa em branco. Um passeio que ninguém vai lembrar. A sensação de que a família merecia algo que ficasse.</div>
  </div>`));

/* 10 — SUCESSO */
slides.push(sb('07','O sucesso','Um dia que vira memória.',`
  <div class="field">
    <div class="field-l">A conquista</div>
    <div class="field-t">Ele volta <b>abastecido</b>, mais perto de quem ama. A visita vira memória, foto e história contada para quem não foi, e desperta vontade de voltar e de trazer mais gente.</div>
  </div>
  <div class="field">
    <div class="field-l">Transformação de identidade</div>
    <div class="fromto">
      <div class="ft-box from"><div class="lab">De</div><div class="txt">alguém que coleciona passeios parecidos</div></div>
      <div class="ft-arrow">→</div>
      <div class="ft-box to"><div class="lab">Para</div><div class="txt">alguém que sabe onde criar memórias com quem ama</div></div>
    </div>
  </div>`));

/* 11 — ONE-LINER */
slides.push(`
<div class="slide stmt">
  <div class="kicker">+ One-liner da marca</div>
  <p>A gente vive em busca de um bom programa, mas poucos viram memória. O <b>Parque Casa Campo</b> reúne jardins, natureza e experiências num lugar só, a 15 minutos da BR-101, para transformar um dia comum em algo que a família <b>guarda para sempre</b>.</p>
</div>`);


/* ---------------- ENGINE ---------------- */
const stage = document.getElementById('stage');
stage.innerHTML = slides.join('');
const all = [...stage.querySelectorAll('.slide')];

/* inject header/footer into every slide except cover (data-nofoot) */
all.forEach((s,i)=>{
  if(!s.hasAttribute('data-nofoot')){
    const h=document.createElement('div'); h.className='rhead'; h.textContent=HEAD; s.appendChild(h);
    const f=document.createElement('div'); f.className='rfoot';
    f.innerHTML='<span>'+FOOTL+'</span><span>'+FOOTR+'</span>'; s.appendChild(f);
  }
});

let idx=0;
const bar=document.getElementById('bar');
const count=document.getElementById('count');
function show(n){
  idx=Math.max(0,Math.min(all.length-1,n));
  all.forEach((s,i)=>s.classList.toggle('active',i===idx));
  bar.style.width=((idx)/(all.length-1)*100)+'%';
  count.textContent=String(idx+1).padStart(2,'0')+' / '+String(all.length).padStart(2,'0');
}
function next(){show(idx+1)} function prev(){show(idx-1)}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='Home'){show(0)} else if(e.key==='End'){show(all.length-1)}
  else if(e.key==='f'||e.key==='F'){toggleFs()}
});
document.getElementById('fit').addEventListener('click',e=>{
  const x=e.clientX/window.innerWidth; x>0.28?next():prev();
});
function toggleFs(){ if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()} else {document.exitFullscreen&&document.exitFullscreen()} }

/* scale stage to fit viewport (contain) */
function fit(){
  const w=window.innerWidth, h=window.innerHeight;
  const s=Math.min(w/1280, h/720);
  stage.style.transform='scale('+s+')';
}
const PRINT = /(^|[#?&])print\b/.test(location.hash+location.search);
if(PRINT){
  document.body.classList.add('printing');
  all.forEach(s=>s.classList.add('active'));   /* show every slide, one per page */
}else{
  window.addEventListener('resize',fit);
  fit(); show(0);
  /* fade the hint */
  setTimeout(()=>{const el=document.getElementById('hint'); if(el) el.style.opacity='0'},4200);
}
</script>
</body>
</html>
