<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKA · Narrativa de Marca · Investidor e Consumidor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1a1a; --ink:#ffffff; --body:#cfcfcf; --dim:#8a8a8a; --faint:#5a5a5a;
    --line:rgba(255,255,255,.11); --accent:#d2a24c; --accent-dim:#9c7a3e;
    --stageW:1280px; --stageH:720px;
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif; --disp:'Oswald',var(--sans);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--sans)}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #stage{width:var(--stageW);height:var(--stageH);position:relative;background:var(--bg);overflow:hidden;
    transform-origin:center center;box-shadow:0 40px 120px rgba(0,0,0,.6)}
  .slide{position:absolute;inset:0;padding:58px 70px 54px;opacity:0;visibility:hidden;
    transition:opacity .5s ease;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .rhead{position:absolute;top:44px;left:70px;font-size:11px;letter-spacing:.22em;color:var(--dim);
    text-transform:uppercase;font-weight:500}
  .rhead-mark{position:absolute;top:44px;right:70px;font-size:12px;letter-spacing:.28em;color:var(--accent);
    text-transform:uppercase;font-weight:700;font-family:var(--disp)}
  .rfoot{position:absolute;bottom:34px;left:70px;right:70px;display:flex;justify-content:space-between;
    font-size:10.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;font-weight:500}
  .kicker{font-size:13px;letter-spacing:.30em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .rule{height:1px;background:var(--line);width:100%}
  .cover{display:flex;flex-direction:column;justify-content:center}
  .cover .kicker{margin-bottom:26px;color:var(--dim)}
  .cover h1{font-family:var(--disp);font-size:82px;font-weight:700;color:var(--ink);letter-spacing:-.01em;
    line-height:1.02;text-transform:uppercase}
  .cover .sub{margin-top:22px;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .cover .meta{position:absolute;left:70px;bottom:110px;color:var(--dim);font-size:13px;line-height:1.8;
    font-weight:400;letter-spacing:.02em}
  .lead{display:flex;flex-direction:column;justify-content:center;height:100%;padding-top:10px}
  .lead .kicker{margin-bottom:20px}
  .lead h2{font-family:var(--disp);font-size:44px;font-weight:600;color:var(--ink);letter-spacing:-.005em;
    line-height:1.12;max-width:920px}
  .lead h2 em{font-style:normal;color:var(--accent)}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:52px}
  .trio .tl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:12px}
  .trio .tt{font-size:16px;line-height:1.55;color:var(--body)}
  .note{margin-top:44px;font-size:15px;line-height:1.6;color:var(--dim);max-width:960px;
    border-top:1px solid var(--line);padding-top:22px}
  .note b{color:var(--body);font-weight:600}
  .front{display:flex;flex-direction:column;justify-content:center;height:100%}
  .front .kicker{margin-bottom:18px}
  .front h2{font-family:var(--disp);font-size:64px;font-weight:700;color:var(--ink);text-transform:uppercase;
    letter-spacing:-.005em;line-height:1}
  .front .tag{margin-top:18px;font-size:19px;color:var(--body);max-width:640px;line-height:1.4}
  .front .pub{margin-top:30px;font-size:13px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .sb{display:grid;grid-template-columns:35% 1fr;gap:56px;height:100%;align-content:center;padding-top:20px}
  .sb-left{display:flex;flex-direction:column;justify-content:center}
  .sb-num{font-family:var(--disp);font-size:150px;font-weight:700;color:var(--accent);line-height:.85;letter-spacing:-.02em}
  .sb-label{margin-top:10px;font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);font-weight:600}
  .sb-ess{margin-top:26px;font-size:21px;font-weight:400;color:var(--body);line-height:1.4;max-width:330px}
  .sb-body{align-self:center;max-width:620px}
  .field{margin-bottom:24px}
  .field:last-child{margin-bottom:0}
  .field-l{font-size:11.5px;letter-spacing:.20em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:9px}
  .field-t{font-size:16.5px;line-height:1.6;color:var(--body);font-weight:400}
  .field-t b{color:var(--ink);font-weight:600}
  .want{border-left:2px solid var(--accent);padding:4px 0 4px 20px}
  .want .field-t{font-size:20px;line-height:1.45;color:var(--ink);font-weight:400}
  .steps{display:flex;flex-direction:column;gap:14px}
  .step{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:baseline}
  .step .sn{color:var(--accent);font-size:15px;font-weight:700;font-family:var(--disp)}
  .step .st{font-size:16.5px;line-height:1.5;color:var(--body)}
  .step .st b{color:var(--ink);font-weight:600}
  .fromto{display:grid;grid-template-columns:1fr 34px 1fr;gap:18px;align-items:center;margin-top:4px}
  .ft-box .lab{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:600}
  .ft-box .txt{font-size:15.5px;line-height:1.5;color:var(--body)}
  .ft-box.to .txt{color:var(--ink)}
  .ft-arrow{color:var(--accent);font-size:26px;text-align:center;font-weight:400}
  .stmt{display:flex;flex-direction:column;justify-content:center}
  .stmt .kicker{margin-bottom:34px}
  .stmt p{font-size:34px;font-weight:400;color:var(--ink);line-height:1.32;letter-spacing:-.005em;max-width:1050px;
    font-family:var(--disp);text-transform:uppercase}
  #bar{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:10;transition:width .4s ease}
  #count{position:fixed;bottom:16px;right:20px;color:#5a5a54;font-size:12px;letter-spacing:.15em;z-index:10;font-weight:500}
  #hint{position:fixed;bottom:16px;left:20px;color:#4a4a44;font-size:11px;letter-spacing:.08em;z-index:10;
    transition:opacity 1s ease;font-weight:400}
  html,body,#fit,#stage,.slide{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:1280px 720px;margin:0}
  body.printing{overflow:visible;background:var(--bg)}
  body.printing #fit{position:static;display:block;height:auto;background:var(--bg)}
  body.printing #stage{transform:none!important;width:1280px;height:auto;box-shadow:none}
  body.printing .slide{position:relative;inset:auto;opacity:1!important;visibility:visible!important;
    width:1280px;height:720px;page-break-after:always;break-after:page}
  body.printing .slide:last-child{page-break-after:auto;break-after:auto}
  body.printing #bar,body.printing #count,body.printing #hint{display:none!important}
</style>
</head>
<body>
<div id="bar"></div>
<div id="fit"><div id="stage"></div></div>
<div id="count"></div>
<div id="hint">← → para navegar &nbsp;·&nbsp; F para tela cheia</div>

<script>
const HEAD = 'OKA · Narrativa de Marca';
const FOOTL = 'OKA · Narrativa de Marca';
const FOOTR = 'Mira Brand Studio';
const slides = [];

slides.push(`
<div class="slide cover" data-nofoot>
  <div class="kicker">Cliente · OKA Floripa</div>
  <h1>Frentes Secundárias</h1>
  <div class="sub">Investidor e Consumidor · Sub-roteiros aninhados</div>
  <div class="meta">Desenvolvido por MIRA BRAND STUDIO<br>Etapa 2 · Narrativa de Marca · setembro de 2026</div>
</div>`);

slides.push(`
<div class="slide">
  <div class="lead">
    <div class="kicker">00 · Ponto de partida</div>
    <h2>Mesmo guia, mesma promessa. <em>Dois pontos da mesma cadeia.</em></h2>
    <div class="trio">
      <div><div class="tl">Investidor</div><div class="tt">Recebe o resultado que o operador gera. Grupo fechado: os 9 cotistas atuais.</div></div>
      <div><div class="tl">Consumidor</div><div class="tt">Valida o resultado com presença e consumo. Adulto profissional, ainda não reconhecido pela marca.</div></div>
      <div><div class="tl">Herança</div><div class="tt">Ambos herdam o tom, o guia e a promessa da marca-mãe: o Operador.</div></div>
    </div>
    <div class="note">Nota sobre o investidor: os documentos do projeto tratam esse público como um grupo fechado, sem intenção declarada de captar capital novo. Por isso este roteiro é de <b>retenção e prestação de contas</b>, não de atração — confirmado pelo cliente em setembro de 2026.</div>
  </div>
</div>`);

function front(kicker,title,tag,pub){
  return `
<div class="slide">
  <div class="front">
    <div class="kicker">${kicker}</div>
    <h2>${title}</h2>
    <div class="tag">${tag}</div>
    <div class="pub">${pub}</div>
  </div>
</div>`;
}
function sb(num,label,ess,body){
  return `
<div class="slide">
  <div class="sb">
    <div class="sb-left">
      <div class="sb-num">${num}</div>
      <div class="sb-label">${label}</div>
      <div class="sb-ess">${ess}</div>
    </div>
    <div class="sb-body">${body}</div>
  </div>
</div>`;
}
function stmt(kicker,text){
  return `
<div class="slide stmt">
  <div class="kicker">${kicker}</div>
  <p>${text}</p>
</div>`;
}

/* ===== INVESTIDOR ===== */
slides.push(front('Frente 1 · Investidor','INVESTIDOR','Quem já apostou e aguarda o retorno prometido.','Público: os 9 cotistas atuais da SPE do mall'));

slides.push(sb('01','O herói','Um cotista que aportou capital esperando retorno num prazo definido.',`
  <div class="field"><div class="field-l">Quem é</div><div class="field-t">Cotista da SPE do mall, que aportou capital na expectativa de retorno dentro de um prazo definido.</div></div>
  <div class="field want"><div class="field-l">O que ele quer</div><div class="field-t">Ver o capital aportado gerar o retorno prometido, com previsibilidade.</div></div>`));

slides.push(sb('02','O problema','O prazo que passou do combinado sem a distribuição se concretizar.',`
  <div class="field"><div class="field-l">Vilão</div><div class="field-t"><b>O prazo que passou do combinado</b> sem a distribuição de resultados se concretizar.</div></div>
  <div class="field"><div class="field-l">Externo</div><div class="field-t">O retorno era esperado em cerca de um ano; já passaram mais de quatro sem distribuição aos cotistas.</div></div>
  <div class="field"><div class="field-l">Interno</div><div class="field-t">A dúvida sobre ter apostado certo, e a ansiedade de ver capital parado numa operação que ainda parece um shopping pequeno tentando ser grande.</div></div>
  <div class="field"><div class="field-l">Filosófico</div><div class="field-t">Um investimento imobiliário sério deveria devolver previsibilidade, não a incerteza que existe hoje.</div></div>`));

slides.push(sb('03','O guia','Uma equação diagnosticada, com resultado já em movimento.',`
  <div class="field"><div class="field-l">Empatia</div><div class="field-t">"Sabemos que o prazo já passou do combinado, e que isso pesa."</div></div>
  <div class="field"><div class="field-l">Autoridade</div><div class="field-t">Inadimplência caiu de forma significativa desde a profissionalização da cobrança. Grandes eventos que não geravam retorno foram cortados. O comitê de seleção prioriza capacidade de pagamento antes de afinidade de mix. Parte dos contratos vincula o aluguel ao faturamento do operador. Estacionamento é hoje o maior gerador de receita de locação, e o media kit é uma fonte nova ainda inexplorada.</div></div>`));

slides.push(sb('04','O plano','Da raiz diagnosticada à correção silenciosa da equação.',`
  <div class="field"><div class="field-l">Plano de processo</div>
    <div class="steps">
      <div class="step"><span class="sn">1</span><span class="st"><b>Raiz diagnosticada</b>: um modelo de shopping desproporcional ao porte do empreendimento.</span></div>
      <div class="step"><span class="sn">2</span><span class="st"><b>Correção silenciosa</b>, sem colocar em risco o que já foi construído com lojistas e mercado.</span></div>
      <div class="step"><span class="sn">3</span><span class="st"><b>Seleção mais rigorosa</b> de operador reduz turnover, inadimplência e vacância.</span></div>
      <div class="step"><span class="sn">4</span><span class="st"><b>Novas fontes de receita</b> somam à equação.</span></div>
    </div>
  </div>
  <div class="field"><div class="field-l">Plano de acordo · promessas</div><div class="field-t">Prestação de contas transparente · nenhuma mudança abrupta que arrisque o que já está de pé · o objetivo desde a origem continua o mesmo: retomar a distribuição.</div></div>`));

slides.push(sb('05','A ação','Acompanhar a correção em curso, com indicadores claros.',`
  <div class="field"><div class="field-l">Chamada direta</div><div class="field-t"><b>Acompanhar e apoiar o reposicionamento em curso.</b></div></div>
  <div class="field"><div class="field-l">Chamada transicional</div><div class="field-t">Acompanhar os indicadores reportados periodicamente: turnover, inadimplência, inversão da demanda.</div></div>`));

slides.push(sb('06','O que se evita','O que continua em jogo se nada mudar.',`
  <div class="field"><div class="field-l">O que está em jogo</div><div class="field-t">Mais tempo de capital parado. A operação continuar presa a um modelo que nunca gerou o retorno esperado. Perder a paciência com uma correção que já está em curso.</div></div>`));

slides.push(sb('07','O sucesso','A equação fecha, e a distribuição volta.',`
  <div class="field"><div class="field-l">A conquista</div><div class="field-t">A equação fecha e a <b>distribuição de resultados é retomada</b>.</div></div>
  <div class="field"><div class="field-l">Transformação de identidade</div>
    <div class="fromto">
      <div class="ft-box from"><div class="lab">De</div><div class="txt">investidor que aportou capital numa aposta ainda não comprovada</div></div>
      <div class="ft-arrow">→</div>
      <div class="ft-box to"><div class="lab">Para</div><div class="txt">investidor que vê a aposta original validada pelo retormo</div></div>
    </div>
  </div>`));

slides.push(stmt('+ One-liner · Investidor','O retorno que ficou pra trás volta a fazer sentido quando o OKA finalmente é o que sempre deveria ter sido.'));

/* ===== CONSUMIDOR ===== */
slides.push(front('Frente 2 · Consumidor','CONSUMIDOR','Quem resolve o dia de trabalho num só endereço.','Público: adulto ativo profissionalmente — migrante recente, casal jovem, profissional autônomo'));

slides.push(sb('01','O herói','Alguém de fora, ou já da região, que precisa resolver o dia com eficiência.',`
  <div class="field"><div class="field-l">Quem é</div><div class="field-t">Pessoas de fora, muitas vindas do sul do país em busca de qualidade de vida, com frequência casais jovens que chegam sem rede de contatos na cidade; soma-se quem já mora na região e trabalha de forma autônoma ou remota.</div></div>
  <div class="field want"><div class="field-l">O que ele quer</div><div class="field-t">Resolver o dia: trabalhar, se reunir, comer bem, resolver um serviço, sem atravessar a cidade.</div></div>`));

slides.push(sb('02','O problema','O dia fragmentado em vários endereços diferentes.',`
  <div class="field"><div class="field-l">Vilão</div><div class="field-t"><b>O dia fragmentado</b> em vários endereços diferentes.</div></div>
  <div class="field"><div class="field-l">Externo</div><div class="field-t">Resolver o que precisa costuma exigir ir a vários lugares distintos pela cidade; para quem chegou há pouco, ainda não existe um ponto de referência natural.</div></div>
  <div class="field"><div class="field-l">Interno</div><div class="field-t">A sensação de estar sempre correndo, sem lugar fixo; para quem é de fora, a insegurança de não conhecer ninguém e começar do zero.</div></div>
  <div class="field"><div class="field-l">Filosófico</div><div class="field-t">Resolver o dia não devia significar atravessar a cidade nem estar sozinho nisso.</div></div>`));

slides.push(sb('03','O guia','Um endereço com prova concreta de que já funciona assim.',`
  <div class="field"><div class="field-l">Empatia</div><div class="field-t">"Sabemos como é chegar num lugar novo sem conhecer ninguém, ou só querer resolver o dia sem perder tempo indo de um canto a outro da cidade."</div></div>
  <div class="field"><div class="field-l">Autoridade</div><div class="field-t">Nota 4,5 em 1.680 avaliações no Google. Estacionamento, limpeza, organização e integração com a natureza estão entre os pontos mais elogiados. As mesas com tomada lotam pela manhã. Cartório, Arquipélago e Kerfé resolvendo necessidades reais no mesmo endereço.</div></div>`));

slides.push(sb('04','O plano','Chegar, resolver, e esbarrar em quem também está resolvendo.',`
  <div class="field"><div class="field-l">Plano de processo</div>
    <div class="steps">
      <div class="step"><span class="sn">1</span><span class="st"><b>Chegue e estacione</b> sem stress.</span></div>
      <div class="step"><span class="sn">2</span><span class="st"><b>Trabalhe, almoce ou resolva um serviço</b> no mesmo endereço.</span></div>
      <div class="step"><span class="sn">3</span><span class="st"><b>Esbarre em gente</b> que também está ali resolvendo o dia — pode virar contato, pode virar rede.</span></div>
    </div>
  </div>
  <div class="field"><div class="field-l">Plano de acordo · promessas</div><div class="field-t">Ambiente limpo, seguro e tranquilo todos os dias · o tempo e o custo valem a pena · nenhuma pressão pra ficar além do que precisa.</div></div>`));

slides.push(sb('05','A ação','Um convite direto pro dia a dia.',`
  <div class="field"><div class="field-l">Chamada direta</div><div class="field-t"><b>Venha resolver o dia: trabalhar, almoçar, marcar a próxima reunião.</b></div></div>
  <div class="field"><div class="field-l">Chamada transicional</div><div class="field-t">Conhecer os serviços disponíveis no local · seguir o Instagram do OKA.</div></div>`));

slides.push(sb('06','O que se evita','O que continua em jogo se ele não vier.',`
  <div class="field"><div class="field-l">O que está em jogo</div><div class="field-t">Mais um dia perdido em deslocamento. Continuar sem uma rede de contatos na cidade nova. Não ter um endereço de referência pra resolver o simples.</div></div>`));

slides.push(sb('07','O sucesso','Um endereço de referência, com rede incluída.',`
  <div class="field"><div class="field-l">A conquista</div><div class="field-t">Ele tem um endereço de referência: resolve o que precisa e, sem procurar, <b>constrói rede</b>.</div></div>
  <div class="field"><div class="field-l">Transformação de identidade</div>
    <div class="fromto">
      <div class="ft-box from"><div class="lab">De</div><div class="txt">quem resolve o dia correndo por vários endereços diferentes, sem raiz na cidade</div></div>
      <div class="ft-arrow">→</div>
      <div class="ft-box to"><div class="lab">Para</div><div class="txt">quem tem um endereço fixo onde o dia se resolve e a rede se constrói sozinha</div></div>
    </div>
  </div>`));

slides.push(stmt('+ One-liner · Consumidor','Um endereço onde o dia se resolve inteiro, e onde, sem procurar, você constrói a rede que ainda não tinha.'));

const stage = document.getElementById('stage');
stage.innerHTML = slides.join('');
const all = [...stage.querySelectorAll('.slide')];
all.forEach((s,i)=>{
  if(!s.hasAttribute('data-nofoot')){
    const m=document.createElement('div'); m.className='rhead-mark'; m.textContent='OKA'; s.appendChild(m);
    const h=document.createElement('div'); h.className='rhead'; h.textContent=HEAD; s.appendChild(h);
    const f=document.createElement('div'); f.className='rfoot';
    f.innerHTML='<span>'+FOOTL+'</span><span>'+FOOTR+'</span>'; s.appendChild(f);
  }
});
let idx=0;
const bar=document.getElementById('bar');
const count=document.getElementById('count');
function show(n){
  idx=Math.max(0,Math.min(all.length-1,n));
  all.forEach((s,i)=>s.classList.toggle('active',i===idx));
  bar.style.width=((idx)/(all.length-1)*100)+'%';
  count.textContent=String(idx+1).padStart(2,'0')+' / '+String(all.length).padStart(2,'0');
}
function next(){show(idx+1)} function prev(){show(idx-1)}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='Home'){show(0)} else if(e.key==='End'){show(all.length-1)}
  else if(e.key==='f'||e.key==='F'){toggleFs()}
});
document.getElementById('fit').addEventListener('click',e=>{
  const x=e.clientX/window.innerWidth; x>0.28?next():prev();
});
function toggleFs(){ if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()} else {document.exitFullscreen&&document.exitFullscreen()} }
function fit(){
  const w=window.innerWidth, h=window.innerHeight;
  const s=Math.min(w/1280, h/720);
  stage.style.transform='scale('+s+')';
}
const PRINT = /(^|[#?&])print\b/.test(location.hash+location.search);
if(PRINT){
  document.body.classList.add('printing');
  all.forEach(s=>s.classList.add('active'));
}else{
  window.addEventListener('resize',fit);
  fit(); show(0);
  setTimeout(()=>{const el=document.getElementById('hint'); if(el) el.style.opacity='0'},4200);
}
</script>
</body>
</html>
