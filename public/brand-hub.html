<title>Cruz de Malta Brand System</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Brand System interativo do Cruz de Malta — logos, cores, tipografia e guia para IA. Desenhado pela Mira." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />

<style>
  /* ============================================================= *
   * MIRA · BRAND HUB — template genérico.
   * Trocar de cliente = editar o objeto BRAND (JS) + os tokens de
   * marca (--c1..--c5). O resto do CSS nunca muda.
   * A SUPERFÍCIE do hub é a Mira (escuro + dourado). As cores do
   * CLIENTE vivem dentro, em swatches/amostras — fixas nos dois temas.
   * ============================================================= */
  :root {
    /* --- Superfície do hub — Mira (escuro, padrão) --- */
    --hub-bg: #14110E;
    --surface: #1E1A15;
    --surface-2: #251F17;
    --border: rgba(243, 236, 224, 0.12);
    --border-strong: rgba(243, 236, 224, 0.22);
    --text: #F3ECE0;
    --muted: #A9A093;
    --gold: #C9A227;
    --gold-soft: #D8B65A;
    --shadow: 0 1px 0 rgba(243,236,224,0.04), 0 18px 40px -24px rgba(0,0,0,0.7);

    /* --- Paleta da MARCA (fixa nos dois temas) — Cruz de Malta --- */
    --c1: #E71E2E; /* Vermelho */
    --c2: #891623; /* Bordô */
    --c3: #F8E2C0; /* Creme */
    --c4: #19191A; /* Tinta */
    --c5: #FFFFFF; /* Papel */

    --radius: 999px;
    --radius-card: 20px;
    --maxw: 1120px;
    --nav-h: 76px;

    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --hub-bg: #FBF9F4;
      --surface: #FFFFFF;
      --surface-2: #F3EFE6;
      --border: rgba(20, 17, 14, 0.12);
      --border-strong: rgba(20, 17, 14, 0.22);
      --text: #1A1712;
      --muted: #6B6357;
      --gold: #977619;
      --gold-soft: #B8912E;
      --shadow: 0 1px 0 rgba(20,17,14,0.03), 0 18px 40px -26px rgba(20,17,14,0.28);
    }
  }
  :root[data-theme="light"] {
    --hub-bg: #FBF9F4;
    --surface: #FFFFFF;
    --surface-2: #F3EFE6;
    --border: rgba(20, 17, 14, 0.12);
    --border-strong: rgba(20, 17, 14, 0.22);
    --text: #1A1712;
    --muted: #6B6357;
    --gold: #977619;
    --gold-soft: #B8912E;
    --shadow: 0 1px 0 rgba(20,17,14,0.03), 0 18px 40px -26px rgba(20,17,14,0.28);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 16px); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    margin: 0;
    background: var(--hub-bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  /* ---------- Nav em pílula ---------- */
  .nav-shell {
    position: sticky; top: 0; z-index: 60;
    display: flex; justify-content: center;
    padding: 16px; pointer-events: none;
  }
  .nav {
    pointer-events: auto;
    display: flex; align-items: center; gap: 4px;
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px; box-shadow: var(--shadow);
    max-width: calc(100% - 8px);
  }
  .nav a {
    color: var(--muted); text-decoration: none;
    font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em;
    padding: 9px 15px; border-radius: var(--radius);
    white-space: nowrap; transition: color .18s, background .18s;
  }
  .nav a:hover { color: var(--text); }
  .nav a.active { color: var(--hub-bg); background: var(--text); }
  .nav .spacer { flex: 1; min-width: 4px; }
  .icon-btn {
    display: grid; place-items: center;
    width: 38px; height: 38px; flex: 0 0 auto;
    border-radius: 50%; border: none; cursor: pointer;
    background: transparent; color: var(--muted);
    transition: color .18s, background .18s;
  }
  .icon-btn:hover { color: var(--text); background: var(--surface-2); }
  .nav-scroll { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .nav-scroll::-webkit-scrollbar { display: none; }

  /* ---------- Seções ---------- */
  section { padding: 86px 0; border-top: 1px solid var(--border); }
  section:first-of-type { border-top: none; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold);
  }
  .sec-head { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 44px; }
  @media (min-width: 800px) { .sec-head { grid-template-columns: 1fr 1fr; align-items: end; } }
  .sec-head h2 {
    margin: 4px 0 0; font-size: clamp(30px, 4.4vw, 46px);
    font-weight: 800; letter-spacing: -0.02em; line-height: 1.02; text-wrap: balance;
  }
  .sec-head p { margin: 0; color: var(--muted); max-width: 42ch; }
  @media (min-width: 800px) { .sec-head p { justify-self: end; text-align: right; } }
  .grp-label { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 34px 0 16px; }

  /* ---------- Hero ---------- */
  .hero { padding: clamp(40px, 9vh, 96px) 0 72px; border-top: none; }
  .hero-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 14px;
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted);
  }
  .chip b { color: var(--text); }
  .hero-logo {
    margin: 34px 0 8px; border-radius: var(--radius-card);
    overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow);
    background: var(--c1);
    display: grid; place-items: center; padding: min(8vw, 72px);
  }
  .hero-logo img { width: min(560px, 78%); height: auto; display: block; }
  .hero-lede { margin: 26px 0 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .hero-lede .name { font-size: clamp(26px, 4vw, 38px); font-weight: 800; letter-spacing: -0.02em; }
  .hero-lede .tag { color: var(--muted); font-size: clamp(16px, 2vw, 19px); }
  .instruct {
    margin-top: 22px; display: inline-flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 14px;
  }
  .instruct .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

  /* ---------- Cards / grids ---------- */
  .grid { display: grid; gap: 18px; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 880px) { .g3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .g3, .g2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-body { padding: 18px 20px; }

  /* Logo cards */
  .logo-vis { aspect-ratio: 16 / 10; display: grid; place-items: center; padding: 26px; }
  .logo-vis img { max-width: 82%; max-height: 82%; height: auto; }
  .logo-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-top: 1px solid var(--border); }
  .logo-meta .lm-name { font-weight: 700; font-size: 14.5px; }
  .logo-meta .lm-role { color: var(--muted); font-size: 12.5px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    border-radius: var(--radius); border: 1px solid var(--border-strong);
    background: transparent; color: var(--text);
    font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 14px;
    text-decoration: none; transition: background .16s, border-color .16s, color .16s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-gold { background: var(--gold); border-color: var(--gold); color: #14110E; }
  .btn-gold:hover { background: var(--gold-soft); }

  /* Swatches */
  .swatch { text-align: left; cursor: pointer; border: 1px solid var(--border); background: var(--surface); }
  .swatch:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .swatch .chipcolor { height: 128px; position: relative; }
  .swatch .copyhint {
    position: absolute; inset: 0; display: grid; place-items: center;
    opacity: 0; transition: opacity .16s;
  }
  .swatch:hover .copyhint { opacity: 1; }
  .copyhint span {
    background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
    border-radius: var(--radius); font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; padding: 7px 12px;
  }
  .swatch .sw-body { padding: 14px 16px 16px; }
  .sw-name { font-weight: 700; font-size: 14.5px; }
  .sw-vals { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.7; font-variant-numeric: tabular-nums; }
  .sw-vals code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: -0.01em; }

  /* Pairings */
  .pair { border-radius: var(--radius-card); overflow: hidden; border: 1px solid var(--border); }
  .pair .demo { padding: 26px 24px 22px; }
  .pair .demo .p-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .pair .demo .p-head { font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin: 8px 0 6px; }
  .pair .demo .p-body { font-size: 14px; opacity: .92; margin: 0; }
  .pair .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  .pair .meta .combo { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 4px 9px; border-radius: var(--radius); }
  .badge.aaa { background: color-mix(in srgb, #2ec16a 22%, transparent); color: #34d17a; }
  .badge.aa { background: color-mix(in srgb, var(--gold) 24%, transparent); color: var(--gold-soft); }
  .badge.fail { background: color-mix(in srgb, var(--c1) 26%, transparent); color: #ff8a8a; }

  /* Type */
  .type-card { padding: 26px 24px; }
  .type-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .type-role { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .type-sample { margin: 14px 0 10px; letter-spacing: -0.02em; text-wrap: balance; }
  .type-pangram { color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
  .type-specs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  @media (max-width: 560px) { .type-specs { grid-template-columns: repeat(2, 1fr); } }
  .type-specs .k { font-size: 15px; font-weight: 700; }
  .type-specs .l { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .note-card { padding: 22px 24px; border: 1px dashed var(--border-strong); background: transparent; color: var(--muted); border-radius: var(--radius-card); }
  .note-card b { color: var(--text); }

  /* Prose (Essência / Verbal) */
  .prose p { max-width: 62ch; color: var(--text); }
  .lead { font-size: clamp(18px, 2.4vw, 22px); font-weight: 500; line-height: 1.5; letter-spacing: -0.01em; }
  .attrs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .attrs .tag2 { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 14px; font-size: 13px; font-weight: 600; }
  .quote { margin: 22px 0 0; padding: 18px 22px; border-left: 3px solid var(--gold); background: var(--surface); border-radius: 0 14px 14px 0; }
  .quote p { margin: 0; font-size: clamp(18px, 2.2vw, 21px); font-weight: 600; letter-spacing: -0.01em; }
  .sim-nao { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  @media (max-width: 620px) { .sim-nao { grid-template-columns: 1fr; } }
  .sn { border-radius: var(--radius-card); border: 1px solid var(--border); overflow: hidden; }
  .sn h4 { margin: 0; padding: 12px 18px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .sn.sim h4 { background: color-mix(in srgb, #2ec16a 16%, transparent); color: #34d17a; }
  .sn.nao h4 { background: color-mix(in srgb, var(--c1) 16%, transparent); color: #ff8a8a; }
  .sn ul { margin: 0; padding: 14px 18px 18px 34px; }
  .sn li { margin: 6px 0; color: var(--text); }

  .list-clean { list-style: none; margin: 0; padding: 0; }
  .list-clean li { display: flex; gap: 12px; padding: 7px 0; color: var(--text); }
  .list-clean li::before { content: ""; margin-top: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: 0 0 auto; }

  /* AI Guide */
  .ai-card { padding: 28px; border-radius: var(--radius-card); border: 1px solid var(--border); background: linear-gradient(160deg, var(--surface), var(--surface-2)); }
  .ai-card p { max-width: 60ch; color: var(--muted); }
  .ai-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  pre.ai-preview {
    margin: 22px 0 0; max-height: 320px; overflow: auto;
    background: var(--hub-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 12.5px; line-height: 1.7; color: var(--muted); white-space: pre-wrap;
  }

  /* In use */
  .use-grid { display: grid; gap: 18px; grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 780px) { .use-grid { grid-template-columns: 1fr; } }
  .use-tile { aspect-ratio: 4/5; border-radius: var(--radius-card); display: grid; place-items: center; text-align: center; padding: 24px; border: 1px solid var(--border); overflow: hidden; }
  .use-tile .u-k { font-size: clamp(24px, 3vw, 34px); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .use-tile .u-s { margin-top: 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }

  /* Quick Ref drawer */
  .qr-tab {
    position: fixed; right: 0; top: 42%; z-index: 55; cursor: pointer;
    writing-mode: vertical-rl; text-orientation: mixed;
    background: var(--text); color: var(--hub-bg); border: none;
    font: inherit; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    padding: 16px 8px; border-radius: 12px 0 0 12px; box-shadow: var(--shadow);
  }
  .qr-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 70; opacity: 0; visibility: hidden; transition: opacity .22s; }
  .qr-overlay.open { opacity: 1; visibility: visible; }
  .qr {
    position: fixed; top: 0; right: 0; height: 100%; width: min(380px, 92vw); z-index: 71;
    background: var(--surface); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; box-shadow: -20px 0 50px -30px rgba(0,0,0,.7);
  }
  .qr.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) { .qr { transition: none; } }
  .qr-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; border-bottom: 1px solid var(--border); }
  .qr-head h3 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .02em; }
  .qr-body { padding: 22px; overflow-y: auto; }
  .qr-body h4 { margin: 22px 0 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .qr-body h4:first-child { margin-top: 0; }
  .qr-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; cursor: pointer; }
  .qr-dot { width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--border); flex: 0 0 auto; }
  .qr-row .qr-n { font-size: 13.5px; font-weight: 600; flex: 1; }
  .qr-row .qr-h { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .qr-link { display: flex; justify-content: space-between; padding: 9px 0; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .qr-link span { color: var(--muted); }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--hub-bg);
    padding: 12px 20px; border-radius: var(--radius); z-index: 90;
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .tdot { width: 12px; height: 12px; border-radius: 3px; }

  /* Search */
  .search-wrap { position: fixed; inset: 0; z-index: 80; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; background: rgba(0,0,0,.5); }
  .search-wrap.open { display: flex; }
  .search-box { width: min(560px, 92vw); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .search-box input { width: 100%; border: none; background: transparent; color: var(--text); font: inherit; font-size: 18px; padding: 20px 22px; outline: none; }
  .search-results { border-top: 1px solid var(--border); max-height: 320px; overflow-y: auto; }
  .search-results a { display: flex; justify-content: space-between; padding: 14px 22px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
  .search-results a:hover, .search-results a.sel { background: var(--surface-2); }
  .search-results a span { color: var(--muted); font-size: 12px; }
  .search-empty { padding: 18px 22px; color: var(--muted); }

  /* Footer */
  footer { border-top: 1px solid var(--border); padding: 40px 0 60px; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .foot .mira { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: .02em; color: var(--text); }
  .foot .mira .m-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }

  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

  @media print {
    .nav-shell, .qr-tab, .qr, .qr-overlay, .toast, .search-wrap, .btn { display: none !important; }
    body { background: #fff; color: #000; }
    section { padding: 24px 0; break-inside: avoid; border-top: 1px solid #ccc; }
    .card, .swatch, .pair { break-inside: avoid; }
  }
</style>

<!-- ===================== NAV ===================== -->
<div class="nav-shell">
  <nav class="nav" aria-label="Seções">
    <div class="nav-scroll" id="navLinks"></div>
    <span class="spacer"></span>
    <button class="icon-btn" id="searchBtn" title="Buscar (/)" aria-label="Buscar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema"></button>
  </nav>
</div>

<main class="wrap" id="main"></main>

<!-- Quick Ref -->
<button class="qr-tab" id="qrTab" aria-controls="qr" aria-expanded="false">Ref rápida</button>
<div class="qr-overlay" id="qrOverlay"></div>
<aside class="qr" id="qr" aria-label="Referência rápida" aria-hidden="true"></aside>

<!-- Search -->
<div class="search-wrap" id="searchWrap" role="dialog" aria-modal="true" aria-label="Buscar no Brand System">
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Buscar seção…  (Esc para fechar)" autocomplete="off" />
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"><span class="tdot" id="toastDot"></span><span id="toastMsg"></span></div>

<script>
/* ================================================================
 * BRAND — todo o conteúdo do cliente. Trocar de cliente = editar isto.
 * ================================================================ */
const BRAND = {
  name: "Cruz de Malta",
  tagline: "O restaurante mais tradicional de Pelotas.",
  year: "2026",
  since: "Desde 1967",
  drive: {
    assets: "https://drive.google.com/drive/folders/1rRtiCoDLGGgFoMN42ZWh74cnqHuTnzHc",
    expressao: "https://drive.google.com/drive/folders/1vmNRp891cFr4xx25i4_f_j8vua02B8eU",

    { id: "verbal", label: "Verbal" },
    { id: "em-uso", label: "Em uso" },
    { id: "ia", label: "IA" },
  ];

  /* ---- Templates de seção ---- */
  function secHead(eyebrow, title, desc) {
    return '<div class="sec-head reveal"><div><span class="eyebrow">' + esc(eyebrow) + '</span><h2>' + esc(title) + "</h2></div><p>" + esc(desc) + "</p></div>";
  }

  function heroHTML() {
    const b = BRAND;
    return (
      '<section class="hero" id="hero">' +
      '<div class="hero-top"><span class="chip"><b>' + esc(b.year) + "</b> Brand System</span>" +
      '<span class="chip">' + esc(b.since) + "</span></div>" +
      '<div class="hero-logo"><img src="' + b.logos[0].src + '" alt="Logo ' + esc(b.name) + '"/></div>' +
      '<div class="hero-lede"><span class="name">' + esc(b.name) + '</span><span class="tag">' + esc(b.tagline) + "</span></div>" +
      '<div class="instruct"><span class="dot"></span> Clique em qualquer cor para copiar o hex. Baixe os logos direto daqui.</div>' +
      "</section>"
    );
  }

  function logosHTML() {
    const b = BRAND;
    const cards = b.logos.map((l, i) =>
      '<div class="card reveal">' +
      '<div class="logo-vis" style="background:' + l.pad + '"><img src="' + l.src + '" alt="' + esc(l.name) + '"/></div>' +
      '<div class="logo-meta"><div><div class="lm-name">' + esc(l.name) + '</div><div class="lm-role">' + esc(l.role) + "</div></div>" +
      '<button class="btn" onclick="__dl(BRAND.logos[' + i + '].src, BRAND.logos[' + i + '].file)">↓ PNG</button></div>' +
      "</div>"
    ).join("");
    return (
      '<section id="logos">' +
      secHead("Logos", "Assinatura da marca", "Cada versão em seu contexto. Os arquivos vetoriais (SVG/AI/PDF, RGB e CMYK) ficam no pacote completo no Drive.") +
      '<div class="grid g2">' + cards + "</div>" +
      '<div style="margin-top:22px" class="reveal"><a class="btn btn-gold" href="' + b.drive.assets + '" target="_blank" rel="noopener">↗ Abrir pacote completo no Drive</a></div>' +
      "</section>"
    );
  }

  function colorsHTML() {
    const b = BRAND;
    const sw = b.colors.map((c, i) => {
      const rgb = hexToRgb(c.hex), k = rgbToCmyk(rgb);
      return (
        '<button class="card swatch reveal" onclick="__copyHex(\'' + c.hex + "')\" aria-label=\"Copiar " + esc(c.hex) + '">' +
        '<div class="chipcolor" style="background:' + c.hex + '"><div class="copyhint"><span>Copiar hex</span></div></div>' +
        '<div class="sw-body"><div class="sw-name">' + esc(c.name) + '</div>' +
        '<div class="sw-vals"><code>' + c.hex.toUpperCase() + "</code><br/>RGB " + rgb.r + " " + rgb.g + " " + rgb.b + "<br/>CMYK " + k.c + " " + k.m + " " + k.y + " " + k.k + "</div>" +
        "</div></button>"
      );
    }).join("");
    const pairs = b.pairings.map((p) => {
      const ratio = contrast(p.bg, p.fg), bd = contrastBadge(ratio);
      return (
        '<div class="pair reveal">' +
        '<div class="demo" style="background:' + p.bg + ";color:" + p.fg + '">' +
        '<div class="p-eyebrow">Etiqueta</div><div class="p-head">Cruz de Malta</div>' +
        '<p class="p-body">O restaurante mais tradicional de Pelotas.</p></div>' +
        '<div class="meta"><span class="combo">' + esc(p.label) + '</span><span class="badge ' + bd.cls + '">' + bd.txt + "</span></div>" +
        "</div>"
      );
    }).join("");
    return (
      '<section id="cores">' +
      secHead("Cores", "Paleta", "Clique num swatch para copiar o hex. RGB e CMYK são calculados a partir do hex — nunca digitados.") +
      '<div class="grid g3">' + sw + "</div>" +
      (b.colorsNote ? '<div class="note-card reveal" style="margin-top:22px"><b>Nota:</b> ' + esc(b.colorsNote) + "</div>" : "") +
      '<div class="grp-label">Pares aprovados · contraste calculado (WCAG)</div>' +
      '<div class="grid g2">' + pairs + "</div>" +
      "</section>"
    );
  }

  function typeHTML() {
    const b = BRAND;
    let body;
    if (b.typeNote) {
      body =
        '<div class="note-card reveal"><b>Tipografia em documentação.</b> O sistema tipográfico do Cruz de Malta ainda está sendo definido pela Mira — uma fonte com propósito, que carregue tradição e atualidade. Enquanto isso, a assinatura vintage do logo é a referência de personalidade. Assim que fechada, ela aparece aqui com amostra viva, pangrama e ficha técnica (peso · tracking · leading · caixa).</div>';
    } else {
      body = (b.type || []).map((t) =>
        '<div class="card type-card reveal">' +
        '<div class="type-head"><span class="type-role">' + esc(t.role) + " — " + esc(t.family) + "</span></div>" +
        '<div class="type-sample" style="font-family:' + t.family + ";font-size:" + (t.size || "40px") + ";font-weight:" + (t.weight || 600) + '">' + esc(t.sample) + "</div>" +
        '<div class="type-pangram">Aa Bb Cc Dd Ee Ff Gg Hh Ii Jj Kk Ll Mm Nn Oo Pp Qq Rr Ss Tt Uu Vv Ww Xx Yy Zz</div>' +
        "</div>"
      ).join("");
    }
    return '<section id="tipografia">' + secHead("Tipografia", "Sistema tipográfico", "A tipografia que sustenta a marca em todos os pontos de contato.") + body + "</section>";
  }

  function essenceHTML() {
    const e = BRAND.essence;
    const attrs = e.atributos.map((a) => '<span class="tag2">' + esc(a) + "</span>").join("");
    return (
      '<section id="essencia">' +
      secHead("Essência", "O porquê antes do quê", "Antes dos ativos, a estratégia. É daqui que toda decisão de marca deriva.") +
      '<div class="prose reveal"><p class="lead">' + esc(e.lead) + "</p>" +
      '<div class="grp-label">Propósito</div><p>' + esc(e.proposito) + "</p>" +
      '<div class="grp-label">Posicionamento</div><p>' + esc(e.posicionamento) + "</p>" +
      '<div class="quote"><p>“' + esc(e.quote) + '”</p></div>' +
      '<div class="grp-label">Atributos</div><div class="attrs">' + attrs + "</div>" +
      "</div></section>"
    );
  }

  function verbalHTML() {
    const v = BRAND.verbal;
    const chips = (arr) => arr.map((x) => '<span class="tag2">' + esc(x) + "</span>").join("");
    const ex = v.examples.map((x) =>
      '<div class="sim-nao"><div class="sn sim"><h4>Assim sim</h4><ul><li>' + esc(x.sim) + "</li></ul></div>" +
      '<div class="sn nao"><h4>Assim não</h4><ul><li>' + esc(x.nao) + "</li></ul></div></div>"
    ).join("");
    return (
      '<section id="verbal">' +
      secHead("Verbal", "Tom de voz", "Como a marca soa — e o vocabulário que a mantém fiel a si mesma.") +
      '<div class="prose reveal"><p class="lead">' + esc(v.tom) + "</p>" +
      '<div class="grp-label">Vocabulário — sim</div><div class="attrs">' + chips(v.sim) + "</div>" +
      '<div class="grp-label">Vocabulário — não</div><div class="attrs">' + chips(v.nao) + "</div>" +
      '<div class="grp-label" style="margin-top:30px">Exemplos</div>' + ex +
      "</div></section>"
    );
  }

  function inUseHTML() {
    const b = BRAND;
    const tiles = b.applications.map((a) =>
      '<div class="use-tile reveal" style="background:' + a.bg + ";color:" + a.fg + '"><div><div class="u-k">' + esc(a.k) + '</div><div class="u-s">' + esc(a.s) + "</div></div></div>"
    ).join("");
    return (
      '<section id="em-uso">' +
      secHead("Em uso", "A marca no mundo real", "Como o Cruz de Malta aparece nos pontos de contato.") +
      '<div class="use-grid">' + tiles + "</div>" +
      '<div style="margin-top:22px" class="reveal"><a class="btn" href="' + b.drive.expressao + '" target="_blank" rel="noopener">↗ Ver aplicações e moodboard no Drive</a></div>' +
      "</section>"
    );
  }

  /* ---- Guia pra IA — gera o brand.md a partir de BRAND ---- */
  function buildMarkdown() {
    const b = BRAND, L = [];
    L.push("# " + b.name + " — Brand System");
    L.push("> " + b.tagline + "  ·  " + b.since);
    L.push("_Documento gerado pela Mira Brand Studio._");
    L.push("\n## Essência");
    L.push(b.essence.lead);
    L.push("**Propósito:** " + b.essence.proposito);
    L.push("**Posicionamento:** " + b.essence.posicionamento);
    L.push("**Atributos:** " + b.essence.atributos.join(", "));
    L.push("\n## Tom de voz");
    L.push(b.verbal.tom);
    L.push("**Diga:** " + b.verbal.sim.join(", "));
    L.push("**Evite:** " + b.verbal.nao.join(", "));
    L.push("\n## Cores");
    if (b.colorsNote) L.push("_" + b.colorsNote + "_");
    b.colors.forEach((c) => {
      const rgb = hexToRgb(c.hex), k = rgbToCmyk(rgb);
      L.push("- **" + c.name + "** — `" + c.hex.toUpperCase() + "` · RGB " + rgb.r + " " + rgb.g + " " + rgb.b + " · CMYK " + k.c + " " + k.m + " " + k.y + " " + k.k + (c.role ? " — " + c.role : ""));
    });
    L.push("\n## Logos & assets");
    L.push("Pacote completo (SVG/AI/PDF, RGB+CMYK): " + b.drive.assets);
    L.push("\n_Gerado a partir do Brand System interativo — sempre em sincronia com o hub._");
    return L.join("\n\n");
  }
  function aiHTML() {
    const md = buildMarkdown();
    return (
      '<section id="ia">' +
      secHead("IA", "Use sua marca com IA", "Um resumo estruturado da marca em texto puro. Cole no ChatGPT, Claude ou Midjourney antes de pedir qualquer peça — e o modelo já cria dentro da marca.") +
      '<div class="ai-card reveal"><p>Este texto é gerado a partir do próprio Brand System, então nunca fica desatualizado. Copie para o chat ou baixe o <code>brand.md</code> para o seu editor.</p>' +
      '<div class="ai-actions"><button class="btn btn-gold" id="aiCopy">Copiar guia</button><button class="btn" id="aiDl">Baixar brand.md</button></div>' +
      '<pre class="ai-preview" id="aiPre">' + esc(md) + "</pre></div></section>"
    );
  }

  function footerHTML() {
    return (
      '<footer><div class="wrap foot"><span class="mira"><span class="m-dot"></span>' + esc(BRAND.credits) + "</span>" +
      '<a href="' + BRAND.studioUrl + '" target="_blank" rel="noopener" style="color:var(--muted);text-decoration:none">somosmira.com.br ↗</a></div></footer>'
    );
  }

  /* ---- Montagem ---- */
  $("#main").innerHTML =
    heroHTML() + logosHTML() + colorsHTML() + typeHTML() + essenceHTML() + verbalHTML() + inUseHTML() + aiHTML();
  document.body.insertAdjacentHTML("beforeend", footerHTML());

  // nav
  $("#navLinks").innerHTML = SECTIONS.map((s) => '<a href="#' + s.id + '" data-id="' + s.id + '">' + esc(s.label) + "</a>").join("");

  // AI actions
  $("#aiCopy").addEventListener("click", async () => { (await copyText(buildMarkdown())) ? toast("Guia copiado") : toast("Não consegui copiar", "var(--c1)"); });
  $("#aiDl").addEventListener("click", () => {
    const blob = new Blob([buildMarkdown()], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    downloadDataUri(url, (BRAND.name.toLowerCase().replace(/\s+/g, "-")) + "-brand.md");
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  });

  /* ---- Tema ---- */
  const sun = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>';
  const moon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  function currentDark() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function syncThemeIcon() { $("#themeBtn").innerHTML = currentDark() ? sun : moon; }
  syncThemeIcon();
  $("#themeBtn").addEventListener("click", () => {
    document.documentElement.setAttribute("data-theme", currentDark() ? "light" : "dark");
    syncThemeIcon();
  });

  /* ---- Nav ativa + reveal (IntersectionObserver) ---- */
  const links = Array.from(document.querySelectorAll("#navLinks a"));
  const io = new IntersectionObserver((ents) => {
    ents.forEach((e) => {
      if (e.isIntersecting) {
        const id = e.target.id;
        links.forEach((l) => l.classList.toggle("active", l.dataset.id === id));
      }
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  SECTIONS.forEach((s) => { const el = document.getElementById(s.id); if (el) io.observe(el); });

  const revIO = new IntersectionObserver((ents) => {
    ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); revIO.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".reveal").forEach((el) => revIO.observe(el));

  /* ---- Quick Ref ---- */
  function qrHTML() {
    const b = BRAND;
    const cols = b.colors.map((c) =>
      '<div class="qr-row" onclick="__copyHex(\'' + c.hex + "')\"><span class=\"qr-dot\" style=\"background:" + c.hex + '"></span><span class="qr-n">' + esc(c.name) + '</span><span class="qr-h">' + c.hex.toUpperCase() + "</span></div>"
    ).join("");
    return (
      '<div class="qr-head"><h3>Referência rápida</h3><button class="icon-btn" id="qrClose" aria-label="Fechar">✕</button></div>' +
      '<div class="qr-body"><h4>Cores</h4>' + cols +
      '<h4>Tipografia</h4><div class="qr-row"><span class="qr-n">Em documentação</span></div>' +
      '<h4>Links</h4>' +
      '<a class="qr-link" href="' + b.drive.assets + '" target="_blank" rel="noopener">Pacote de marca <span>Drive ↗</span></a>' +
      '<a class="qr-link" href="' + b.drive.expressao + '" target="_blank" rel="noopener">Aplicações <span>Drive ↗</span></a>' +
      "</div>"
    );
  }
  $("#qr").innerHTML = qrHTML();
  const qr = $("#qr"), qrOv = $("#qrOverlay"), qrTab = $("#qrTab");
  function openQR(o) {
    qr.classList.toggle("open", o); qrOv.classList.toggle("open", o);
    qr.setAttribute("aria-hidden", String(!o)); qrTab.setAttribute("aria-expanded", String(o));
  }
  qrTab.addEventListener("click", () => openQR(!qr.classList.contains("open")));
  qrOv.addEventListener("click", () => openQR(false));
  $("#qr").addEventListener("click", (e) => { if (e.target.id === "qrClose") openQR(false); });

  /* ---- Busca ---- */
  const sw = $("#searchWrap"), si = $("#searchInput"), sr = $("#searchResults");
  let selIdx = 0, results = [];
  function renderResults(q) {
    const term = q.trim().toLowerCase();
    results = SECTIONS.filter((s) => !term || s.label.toLowerCase().includes(term));
    selIdx = 0;
    sr.innerHTML = results.length
      ? results.map((s, i) => '<a href="#' + s.id + '" data-i="' + i + '" class="' + (i === 0 ? "sel" : "") + '">' + esc(s.label) + "<span>ir para a seção</span></a>").join("")
      : '<div class="search-empty">Nada encontrado.</div>';
  }
  function openSearch(o) {
    sw.classList.toggle("open", o);
    if (o) { si.value = ""; renderResults(""); setTimeout(() => si.focus(), 30); }
  }
  function go(i) { const s = results[i]; if (!s) return; openSearch(false); document.getElementById(s.id).scrollIntoView(); }
  $("#searchBtn").addEventListener("click", () => openSearch(true));
  si.addEventListener("input", () => renderResults(si.value));
  si.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); selIdx = Math.min(selIdx + 1, results.length - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); selIdx = Math.max(selIdx - 1, 0); }
    else if (e.key === "Enter") { e.preventDefault(); go(selIdx); return; }
    else return;
    Array.from(sr.children).forEach((a, i) => a.classList && a.classList.toggle("sel", i === selIdx));
  });
  sr.addEventListener("click", (e) => { const a = e.target.closest("a"); if (a) { e.preventDefault(); go(+a.dataset.i); } });
  sw.addEventListener("click", (e) => { if (e.target === sw) openSearch(false); });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { openSearch(false); openQR(false); }
    const typing = /^(input|textarea)$/i.test((e.target.tagName || ""));
    if (!typing && (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"))) { e.preventDefault(); openSearch(true); }
  });
})();
</script>
